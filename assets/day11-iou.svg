<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="IoU coordinate example">
<rect width="1000" height="480" rx="18" fill="#101b2e"/>
<g font-family="sans-serif" fill="#e5edf6"><text x="32" y="42" font-size="25">IoU = intersection / union</text><text x="32" y="74" font-size="17">Continuous coordinates · x right, y down</text></g>
<g transform="translate(100 125)">
<rect x="0" y="0" width="240" height="240" fill="#54d4d9" fill-opacity=".18" stroke="#54d4d9" stroke-width="4"/>
<rect x="60" y="0" width="240" height="240" fill="#ffc55a" fill-opacity=".18" stroke="#ffc55a" stroke-width="4"/>
<rect x="60" y="0" width="180" height="240" fill="#b9ebbe" fill-opacity=".45"/>
<path d="M0 -10V-22 M60 -10V-22 M240 -10V-22 M300 -10V-22" stroke="#e5edf6"/>
<g fill="#e5edf6" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="0" y="-30">0</text><text x="60" y="-30">1</text><text x="240" y="-30">4</text><text x="300" y="-30">5</text><text x="-30" y="6">0</text><text x="-30" y="245">4</text><text x="150" y="125" fill="#101b2e" font-size="25">3 × 4 = 12</text><text x="330" y="-30">x</text><text x="-30" y="278">y</text></g>
</g>
<g fill="#e5edf6" font-family="sans-serif" font-size="22"><text x="480" y="145" fill="#54d4d9">GT: (0, 0, 4, 4) → area 16</text><text x="480" y="195" fill="#ffc55a">Pred: (1, 0, 5, 4) → area 16</text><text x="480" y="255">Intersection = 12</text><text x="480" y="300">Union = 16 + 16 − 12 = 20</text><text x="480" y="355" font-size="30">IoU = 12 / 20 = 0.6</text><text x="32" y="445" font-size="17">Same example: passes IoU ≥ 0.50, fails IoU ≥ 0.75</text></g></svg>
