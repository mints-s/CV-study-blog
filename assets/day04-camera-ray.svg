<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Different depths, one camera ray</title><desc id="desc">In the X Z cross-section, points (-1,4) and (-2,8) share normalized X=-0.25 at Z=1. Positive X points down.</desc><rect width="800" height="340" rx="16" fill="#f1f5ef"/><g font-family="sans-serif" fill="#193e32"><text x="30" y="30" font-size="20">Camera coordinates: X–Z cross-section</text><path d="M70 65V280M70 200H735" stroke="#739583" stroke-width="2"/><text x="742" y="205" font-size="17">Z</text><text x="42" y="280" font-size="17">+X</text><path d="M145 65V250" stroke="#73a38d" stroke-width="2" stroke-dasharray="6 5"/><text x="151" y="85" font-size="16">Z = 1</text><path d="M70 200L670 50" stroke="#18634e" stroke-width="3"/><circle cx="70" cy="200" r="5" fill="#18634e"/><circle cx="145" cy="181.25" r="6" fill="#b87b39"/><circle cx="370" cy="125" r="6" fill="#18634e"/><circle cx="670" cy="50" r="6" fill="#18634e"/><text x="75" y="224" font-size="16">C</text><text x="160" y="245" font-size="16">x_n = −0.25</text><text x="380" y="115" font-size="17">(X, Z) = (−1, 4)</text><text x="570" y="35" font-size="17">(−2, 8)</text><path d="M370 130V200M670 55V200" stroke="#a5b5ab" stroke-dasharray="4 4"/><text x="365" y="224" font-size="16">4</text><text x="665" y="224" font-size="16">8</text><text x="400" y="300" text-anchor="middle" font-size="19">X / Z = −1 / 4 = −2 / 8 = −0.25</text><text x="400" y="325" text-anchor="middle" font-size="14">Virtual normalized plane; Y omitted; no lens distortion.</text></g></svg>