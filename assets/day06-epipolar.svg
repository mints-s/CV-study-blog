<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d"><title id="t">One point, an epipolar line</title><desc id="d">Parallel stereo: left pixel (520,340) corresponds to line v=340 on the right. Depth hypotheses 2 and 4 meters project to u=440 and 480.</desc><rect width="780" height="380" rx="16" fill="#f1f5ef"/><g font-family="sans-serif" fill="#193e32"><text x="30" y="30" font-size="21">Image 1</text><text x="420" y="30" font-size="21">Image 2</text><rect x="30" y="60" width="288" height="216" fill="white" stroke="#739583"/><rect x="420" y="60" width="288" height="216" fill="white" stroke="#739583"/><path d="M30 213H318" stroke="#c6d5c8" stroke-dasharray="4 4"/><path d="M420 213H708" stroke="#18634e" stroke-width="2"/><circle cx="264" cy="213" r="6" fill="#18634e"/><circle cx="618" cy="213" r="5" fill="#18634e"/><circle cx="636" cy="213" r="5" fill="#b87b39"/><text x="92" y="193" font-size="17">p₁ = (520, 340)</text><text x="440" y="193" font-size="17">l₂: v = 340</text><path d="M618 221L570 290M636 221L685 320" stroke="#739583" fill="none"/><text x="430" y="310" font-size="16">Z = 2 m: (440, 340)</text><text x="535" y="345" font-size="16">Z = 4 m: (480, 340)</text><text x="30" y="310" font-size="16">Both frames: 640 × 480 pixels</text><text x="30" y="345" font-size="16">u →, v ↓; B = 0.2 m</text></g></svg>