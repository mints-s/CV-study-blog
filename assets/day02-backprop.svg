<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="title desc"><title id="title">Forward values and backward derivatives</title><desc id="desc">For x=2, y=3, w=1: prediction 2, residual -1, loss 0.5. Local derivatives multiply to -2.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#18634e"/></marker></defs><rect width="840" height="300" rx="16" fill="#f0f5ef"/><g font-family="sans-serif" fill="#193e32" text-anchor="middle"><text x="420" y="30" font-size="17">Forward values → / ← Local derivatives</text><rect x="20" y="86" width="140" height="54" rx="8" fill="#fff" stroke="#18634e"/><text x="90" y="119" font-size="20">w = 1</text><rect x="240" y="86" width="140" height="54" rx="8" fill="#fff" stroke="#18634e"/><text x="310" y="119" font-size="20">y_hat = 2</text><rect x="460" y="86" width="140" height="54" rx="8" fill="#fff" stroke="#18634e"/><text x="530" y="119" font-size="20">r = -1</text><rect x="680" y="86" width="140" height="54" rx="8" fill="#fff" stroke="#18634e"/><text x="750" y="119" font-size="20">L = 0.5</text><path d="M160 100H235" stroke="#18634e" stroke-width="2" marker-end="url(#a)"/><text x="200" y="70" font-size="15">× x (2)</text><path d="M240 165H165" stroke="#18634e" stroke-width="2" marker-end="url(#a)"/><text x="200" y="193" font-size="16">× 2</text><path d="M380 100H455" stroke="#18634e" stroke-width="2" marker-end="url(#a)"/><text x="420" y="70" font-size="15">− y (3)</text><path d="M460 165H385" stroke="#18634e" stroke-width="2" marker-end="url(#a)"/><text x="420" y="193" font-size="16">× 1</text><path d="M600 100H675" stroke="#18634e" stroke-width="2" marker-end="url(#a)"/><text x="640" y="70" font-size="15">0.5 × r²</text><path d="M680 165H605" stroke="#18634e" stroke-width="2" marker-end="url(#a)"/><text x="640" y="193" font-size="16">× (−1)</text><text x="420" y="242" font-size="20">dL/dw = (−1) × 1 × 2 = −2</text><text x="420" y="276" font-size="15">x and y are constants; bias is fixed at zero.</text></g></svg>