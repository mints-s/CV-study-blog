---
layout: default
---
<div class="reading-layout"><aside class="toc"><span class="eyebrow">ON THIS PAGE</span><nav id="toc-links" aria-label="글 목차"></nav><a class="back" href="{{ '/' | relative_url }}">← 모든 노트</a></aside>
<article class="post"><div class="eyebrow">{{ page.category_label }} · {% if page.series_day %}DAY {{ page.series_day }}{% else %}PILOT{% endif %}</div><h1>{{ page.title }}</h1><p class="dek">{{ page.description }}</p><div class="meta">{{ page.date | date: "%Y.%m.%d" }} <span>약 {{ page.reading_time }}분</span><span>{{ page.tags | join: " · " }}</span></div><div class="prose">{{ content }}</div></article></div>
